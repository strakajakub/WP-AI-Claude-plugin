name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.0", "8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
      - name: Lint
        run: find wp-ai-editor tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Tests
        run: php tests/run.php

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin ZIP
        run: zip -r wp-ai-editor.zip wp-ai-editor
      - uses: actions/upload-artifact@v4
        with:
          name: wp-ai-editor
          path: wp-ai-editor.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: wp-ai-editor.zip
